services:
  postgres:
    image: postgres:18.6-alpine3.24
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: wallet_owner
      POSTGRES_PASSWORD: ${WALLET_OWNER_PASSWORD:-wallet_owner}
      POSTGRES_DB: wallet
      PGDATA: /var/lib/postgresql/18/docker
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:-wallet_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-create-wallet-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_owner -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

volumes:
  postgres-data:
