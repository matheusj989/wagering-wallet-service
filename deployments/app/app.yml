services:
  api:
    build:
      context: ../..
      dockerfile: deployments/app/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      INSTANCE_ID: ${INSTANCE_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}

      HTTP_ADDR: ":8080"
      HTTP_WRITE_CONCURRENCY: ${HTTP_WRITE_CONCURRENCY:-12}
      HTTP_WRITE_QUEUE_TIMEOUT: ${HTTP_WRITE_QUEUE_TIMEOUT:-2s}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-65536}

      DATABASE_URL: postgres://wallet_app:${WALLET_APP_PASSWORD:-wallet_app}@postgres:5432/wallet?sslmode=disable
      DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-20}
      DB_POOL_MIN_CONNS: ${DB_POOL_MIN_CONNS:-2}
      DB_POOL_RESERVED: ${DB_POOL_RESERVED:-2}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-3s}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-5s}
      DB_RETRY_ATTEMPTS: ${DB_RETRY_ATTEMPTS:-3}

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_ENDPOINT: http://ministack:4566
      SQS_WAGER_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_DLQ_URL: http://ministack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://ministack:4566/000000000000/wallet-events.fifo

      SQS_CONSUMER_ENABLED: ${SQS_CONSUMER_ENABLED:-true}
      SQS_CONSUMER_WORKERS: ${SQS_CONSUMER_WORKERS:-4}
      SQS_WAIT_TIME: ${SQS_WAIT_TIME:-20s}
      SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-30s}
      SQS_MESSAGE_DEADLINE: ${SQS_MESSAGE_DEADLINE:-10s}
      SQS_RETRY_BACKOFF_BASE: ${SQS_RETRY_BACKOFF_BASE:-5s}
      SQS_RETRY_BACKOFF_MAX: ${SQS_RETRY_BACKOFF_MAX:-5m}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}

      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-500ms}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_LEASE: ${OUTBOX_LEASE:-30s}
      OUTBOX_BACKOFF_BASE: ${OUTBOX_BACKOFF_BASE:-1s}
      OUTBOX_BACKOFF_MAX: ${OUTBOX_BACKOFF_MAX:-5m}

      REFERENCE_WORKER_ENABLED: ${REFERENCE_WORKER_ENABLED:-true}
      REFERENCE_POLL_INTERVAL: ${REFERENCE_POLL_INTERVAL:-1s}
      REFERENCE_BATCH_SIZE: ${REFERENCE_BATCH_SIZE:-10}
      REFERENCE_BACKOFF_BASE: ${REFERENCE_BACKOFF_BASE:-1s}
      REFERENCE_BACKOFF_MAX: ${REFERENCE_BACKOFF_MAX:-60s}
      REFERENCE_TTL: ${REFERENCE_TTL:-15m}

      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/wallet
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/wallet
      OIDC_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-wallet-api}

      FAILPOINT: ${FAILPOINT:-}
    ports:
      - "${APP_PORT_RANGE:-8080-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
